    - name: Build adbd (Android Debug Bridge daemon)
      run: |
        # Set toolchain
        export CROSS_COMPILE=${{ env.GCC_PREFIX }}-
        export PATH=${{ env.TOOLCHAIN_PATH }}/bin:$PATH
        STRIP=${{ env.TOOLCHAIN_PATH }}/bin/${{ env.GCC_PREFIX }}-strip
        
        cd ~/buildroot-${{ env.BUILDROOT_VERSION }}
        
        # Enable android-tools package (includes adbd) in buildroot
        cat >> .config << 'EOF'
        BR2_PACKAGE_ANDROID_TOOLS=y
        BR2_PACKAGE_ANDROID_TOOLS_ADBD=y
        EOF
        
        make olddefconfig 2>/dev/null || true
        
        # Build android-tools (adbd)
        make android-tools -j$(nproc) || {
          echo "Note: android-tools build failed, may need additional dependencies"
          echo "Checking available adb packages..."
          make menuconfig --help 2>/dev/null || true
        }
        
        # Check if adbd was built
        if [ -f ~/buildroot-${{ env.BUILDROOT_VERSION }}/output/target/usr/bin/adbd ]; then
          cp ~/buildroot-${{ env.BUILDROOT_VERSION }}/output/target/usr/bin/adbd ${{ github.workspace }}/adbd
          $STRIP ${{ github.workspace }}/adbd 2>/dev/null || true
          echo "=== adbd binary info ==="
          file ${{ github.workspace }}/adbd
          ${{ env.TOOLCHAIN_PATH }}/bin/${{ env.GCC_PREFIX }}-readelf -d ${{ github.workspace }}/adbd | grep NEEDED || echo "No dynamic dependencies!"
        else
          echo "adbd build via buildroot did not produce output, checking target packages..."
          ls -la ~/buildroot-${{ env.BUILDROOT_VERSION }}/output/target/usr/bin/ 2>/dev/null | grep -i adb || true
        fi
        
    - name: Check binary info
      run: |
        echo "=== at_dlopen binary info ==="
        file demos/at/at_dlopen
        readelf -h demos/at/at_dlopen | head -20
        
        echo "=== nv_dlopen binary info ==="
        file demos/nv/nv_dlopen
        readelf -h demos/nv/nv_dlopen | head -20
        
        echo "=== busybox (swapon) binary info ==="
        file busybox
        readelf -h busybox | head -20
        
        echo "=== tcpdump-static binary info ==="
        file tcpdump-static
        readelf -h tcpdump-static | head -20
        
        if [ -f adbd ]; then
          echo "=== adbd binary info ==="
          file adbd
          readelf -h adbd | head -20
        fi
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: arm-binaries-dlopen
        if-no-files-found: warn
        path: |
          demos/at/at_dlopen
          demos/nv/nv_dlopen
          busybox
          swapon
          swapoff
          mkswap
          tcpdump-static
          curl-static
          adbd

