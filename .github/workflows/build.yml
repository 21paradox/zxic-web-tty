name: Build Demos with Buildroot Toolchain

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      BUILDROOT_VERSION: 2024.02.1
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          wget \
          tar \
          cpio \
          unzip \
          rsync \
          bc \
          libncurses5-dev \
          libncursesw5-dev \
          file \
          python3
        
    - name: Cache buildroot toolchain
      uses: actions/cache@v4
      id: buildroot-cache
      with:
        path: ~/buildroot-output
        key: buildroot-${{ env.BUILDROOT_VERSION }}-armv7-uclibc-softfloat
        
    - name: Download and extract buildroot
      if: steps.buildroot-cache.outputs.cache-hit != 'true'
      run: |
        cd ~
        wget -q https://buildroot.org/downloads/buildroot-${BUILDROOT_VERSION}.tar.xz
        tar -xf buildroot-*.tar.xz
        
    - name: Configure buildroot for ARMv7 + uClibc + soft-float
      if: steps.buildroot-cache.outputs.cache-hit != 'true'
      run: |
        cd ~/buildroot-${BUILDROOT_VERSION}
        
        # Create config for ARMv7 soft-float + uClibc
        cat > .config << 'EOF'
        # Target Architecture
        BR2_arm=y
        BR2_cortex_a7=y
        
        # Soft float (no VFP, no hard float)
        BR2_ARM_SOFT_FLOAT=y
        BR2_ARM_EABI=y
        BR2_ARM_INSTRUCTIONS_ARM=y
        
        # Use uClibc
        BR2_TOOLCHAIN_BUILDROOT_UCLIBC=y
        BR2_KERNEL_HEADERS_5_10=y
        BR2_UCLIBC_VERSION_1_0_44=y
        BR2_BINUTILS_VERSION_2_40_X=y
        BR2_GCC_VERSION_12_X=y
        
        # Don't build target packages, just toolchain
        BR2_INIT_NONE=y
        BR2_SYSTEM_BIN_SH_NONE=y
        BR2_PACKAGE_BUSYBOX=n
        BR2_TARGET_ROOTFS_CPIO=n
        BR2_TARGET_ROOTFS_EXT2=n
        BR2_TARGET_ROOTFS_INITRAMFS=n
        BR2_TARGET_ROOTFS_TAR=n
        
        # Enable toolchain only build
        BR2_TOOLCHAIN=y
        EOF
        
        make olddefconfig
        
    - name: Build toolchain (this may take 20-40 minutes)
      if: steps.buildroot-cache.outputs.cache-hit != 'true'
      run: |
        cd ~/buildroot-${BUILDROOT_VERSION}
        make toolchain -j$(nproc)
        
    - name: Save toolchain to cache directory
      if: steps.buildroot-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/buildroot-output
        cp -r ~/buildroot-${BUILDROOT_VERSION}/output ~/buildroot-output/
        
    - name: Restore toolchain from cache
      if: steps.buildroot-cache.outputs.cache-hit == 'true'
      run: |
        mkdir -p ~/buildroot-${BUILDROOT_VERSION}
        cp -r ~/buildroot-output/output ~/buildroot-${BUILDROOT_VERSION}/
        
    - name: Setup toolchain environment
      run: |
        TOOLCHAIN_PATH=~/buildroot-${BUILDROOT_VERSION}/output/host
        echo "TOOLCHAIN_PATH=$TOOLCHAIN_PATH" >> $GITHUB_ENV
        echo "$TOOLCHAIN_PATH/bin" >> $GITHUB_PATH
        
        # Find the actual gcc binary
        GCC_BIN=$(ls $TOOLCHAIN_PATH/bin/arm*-linux-*-gcc | head -1)
        GCC_PREFIX=$(basename $GCC_BIN | sed 's/-gcc$//')
        echo "GCC_PREFIX=$GCC_PREFIX" >> $GITHUB_ENV
        echo "Found toolchain: $GCC_PREFIX"
        $GCC_BIN --version
        
    - name: Verify toolchain float type
      run: |
        GCC_BIN=${{ env.TOOLCHAIN_PATH }}/bin/${{ env.GCC_PREFIX }}-gcc
        echo "Checking toolchain configuration..."
        $GCC_BIN -dumpmachine
        
    - name: Build at_dlopen demo (NO .so dependency)
      working-directory: demos/at
      run: |
        echo "Building at_dlopen demo with dlopen (no .so files needed)..."
        ${{ env.TOOLCHAIN_PATH }}/bin/${{ env.GCC_PREFIX }}-gcc \
          -mfloat-abi=soft \
          -o at_dlopen at_dlopen.c \
          -ldl
        echo "at_dlopen built successfully!"
        file at_dlopen
        echo "=== Verifying no dynamic dependency on libatutils ==="
        ${{ env.TOOLCHAIN_PATH }}/bin/${{ env.GCC_PREFIX }}-readelf -d at_dlopen | grep NEEDED || true
        
    - name: Build nv_dlopen demo (NO .so dependency)
      working-directory: demos/nv
      run: |
        echo "Building nv_dlopen demo with dlopen (no .so files needed)..."
        ${{ env.TOOLCHAIN_PATH }}/bin/${{ env.GCC_PREFIX }}-gcc \
          -mfloat-abi=soft \
          -o nv_dlopen nv_dlopen.c \
          -ldl
        echo "nv_dlopen built successfully!"
        file nv_dlopen
        echo "=== Verifying no dynamic dependency on libnvram ==="
        ${{ env.TOOLCHAIN_PATH }}/bin/${{ env.GCC_PREFIX }}-readelf -d nv_dlopen | grep NEEDED || true
        
    - name: Static build swapon from BusyBox
      run: |
        # Download BusyBox source
        BUSYBOX_VERSION=1.36.1
        cd /tmp
        wget -q https://www.busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2
        tar -xjf busybox-${BUSYBOX_VERSION}.tar.bz2
        cd busybox-${BUSYBOX_VERSION}
        
        # Set toolchain
        export CROSS_COMPILE=${{ env.GCC_PREFIX }}-
        export PATH=${{ env.TOOLCHAIN_PATH }}/bin:$PATH
        
        # Start with all disabled
        make allnoconfig
        
        # Enable only swap utilities using sed
        sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
        sed -i 's/^# CONFIG_MKSWAP is not set/CONFIG_MKSWAP=y/' .config
        sed -i 's/^# CONFIG_SWAPON is not set/CONFIG_SWAPON=y/' .config
        sed -i 's/^# CONFIG_SWAPOFF is not set/CONFIG_SWAPOFF=y/' .config
        sed -i 's/^# CONFIG_FEATURE_SWAPON_DISCARD is not set/CONFIG_FEATURE_SWAPON_DISCARD=y/' .config
        sed -i 's/^# CONFIG_FEATURE_SWAPON_PRI is not set/CONFIG_FEATURE_SWAPON_PRI=y/' .config
        # Use internal glob to avoid uClibc glob() bug
        sed -i 's/^# CONFIG_ASH_INTERNAL_GLOB is not set/CONFIG_ASH_INTERNAL_GLOB=y/' .config
        
        # Update config
        yes "" | make oldconfig
        
        # Build with static flags
        make -j$(nproc) CFLAGS="-mfloat-abi=soft -Os" LDFLAGS="-static"
        
        # Strip
        ${{ env.TOOLCHAIN_PATH }}/bin/${{ env.GCC_PREFIX }}-strip busybox
        
        echo "=== busybox swap tools binary info ==="
        file busybox
        ${{ env.TOOLCHAIN_PATH }}/bin/${{ env.GCC_PREFIX }}-readelf -d busybox | grep NEEDED || echo "No dynamic dependencies - fully static!"
        
        # Copy to workspace
        cp busybox ${{ github.workspace }}/
        ls -la ${{ github.workspace }}/busybox

    - name: Static build tcpdump
      run: |
        # Set toolchain
        export CROSS_COMPILE=${{ env.GCC_PREFIX }}-
        export PATH=${{ env.TOOLCHAIN_PATH }}/bin:$PATH
        CC=${{ env.TOOLCHAIN_PATH }}/bin/${{ env.GCC_PREFIX }}-gcc
        AR=${{ env.TOOLCHAIN_PATH }}/bin/${{ env.GCC_PREFIX }}-ar
        
        # Build libpcap first
        LIBPCAP_VERSION=1.10.4
        cd /tmp
        wget -q https://www.tcpdump.org/release/libpcap-${LIBPCAP_VERSION}.tar.gz
        tar -xzf libpcap-${LIBPCAP_VERSION}.tar.gz
        cd libpcap-${LIBPCAP_VERSION}
        
        # Configure libpcap for static build (minimal features)
        CC=$CC AR=$AR \
        ./configure \
          --host=arm-linux \
          --prefix=/tmp/libpcap-install \
          --disable-shared \
          --disable-dbus \
          --disable-rdma \
          --without-libnl \
          --without-dpdk \
          --without-snf \
          --without-dag \
          --without-septel \
          ac_cv_prog_cc_c99=-std=gnu99 \
          CFLAGS="-mfloat-abi=soft -Os -std=gnu99" \
          LDFLAGS="-static"
        
        make -j$(nproc)
        make install
        
        # Build tcpdump
        TCPDUMP_VERSION=4.99.4
        cd /tmp
        wget -q https://www.tcpdump.org/release/tcpdump-${TCPDUMP_VERSION}.tar.gz
        tar -xzf tcpdump-${TCPDUMP_VERSION}.tar.gz
        cd tcpdump-${TCPDUMP_VERSION}
        
        # Configure tcpdump with minimal features
        CC=$CC \
        ./configure \
          --host=arm-linux \
          --prefix=/tmp/tcpdump-install \
          --with-pcap=/tmp/libpcap-install \
          --disable-shared \
          --enable-static \
          --without-crypto \
          --without-sandbox-capsicum \
          --without-sandbox-pledge \
          --without-sandbox-chroot \
          --without-sandbox-rlimit \
          --disable-smb \
          --disable-smrsh \
          --disable-localpcap \
          --disable-usb \
          --disable-bluetooth \
          CFLAGS="-mfloat-abi=soft -Os" \
          LDFLAGS="-static"
        
        make -j$(nproc)
        make install
        
        # Strip binary
        ${{ env.TOOLCHAIN_PATH }}/bin/${{ env.GCC_PREFIX }}-strip /tmp/tcpdump-install/sbin/tcpdump
        
        # Copy to workspace
        cp /tmp/tcpdump-install/sbin/tcpdump ${{ github.workspace }}/tcpdump-static
        
        echo "=== tcpdump static binary info ==="
        file ${{ github.workspace }}/tcpdump-static
        ${{ env.TOOLCHAIN_PATH }}/bin/${{ env.GCC_PREFIX }}-readelf -d ${{ github.workspace }}/tcpdump-static | grep NEEDED || echo "No dynamic dependencies - fully static!"
        
    - name: Check binary info
      run: |
        echo "=== at_dlopen binary info ==="
        file demos/at/at_dlopen
        readelf -h demos/at/at_dlopen | head -20
        
        echo "=== nv_dlopen binary info ==="
        file demos/nv/nv_dlopen
        readelf -h demos/nv/nv_dlopen | head -20
        
        echo "=== busybox (swapon) binary info ==="
        file busybox
        readelf -h busybox | head -20
        
        echo "=== tcpdump-static binary info ==="
        file tcpdump-static
        readelf -h tcpdump-static | head -20
        
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: arm-binaries-dlopen
        path: |
          demos/at/at_dlopen
          demos/nv/nv_dlopen
          busybox
          tcpdump-static
          curl-static
